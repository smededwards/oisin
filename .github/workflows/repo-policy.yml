name: Repository policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    tags:
      - '*'

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and type label
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|chore|refactor|test|build|ci|perf|revert)(\([a-z0-9-]+\))?!?:[[:space:]].+ ]]; then
            echo "PR title must use Conventional Commits, for example: fix(wear): include the final alert time"
            exit 1
          fi

          type_count=0
          IFS=',' read -ra labels <<< "$PR_LABELS"
          for label in "${labels[@]}"; do
            if [[ "$label" == type:* ]]; then
              type_count=$((type_count + 1))
            fi
          done

          if [[ "$type_count" -ne 1 ]]; then
            echo "Each PR must have exactly one type:* label. Available labels: type: feature, type: fix, type: docs, type: chore, type: test, type: refactor, type: build, type: ci, type: perf, type: revert, type: release."
            exit 1
          fi

  semver-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use SemVer, for example: v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
