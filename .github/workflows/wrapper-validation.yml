name: Gradle wrapper validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v6
